# ----------------------------------------------------------------
# Docker Compose for Admin Console (shadcn/ui + go-zero)
# Usage:
#   docker compose up -d --build
# Then visit http://localhost
# Default account: admin / 123456
# ----------------------------------------------------------------

services:
  mysql:
    image: mysql:8.0
    container_name: admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: admin_db
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: admin-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: admin-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ADMIN_API_MYSQL_DATASOURCE: root:root123@tcp(mysql:3306)/admin_db?charset=utf8mb4&parseTime=true&loc=Local
      ADMIN_API_REDIS_HOST: redis:6379
    ports:
      - "8088:8080"

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: admin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  redis_data: